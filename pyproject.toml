[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos"
version = "0.1.0"
description = "LLM Wiki Memory OS — Global Memory Operating System"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
vector = ["qdrant-client>=1.7", "chromadb>=0.4"]
search = ["opensearch-py>=2.4"]
ui = ["pywebview>=5.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
mnemos = "core.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--cov=core",
    "--cov=agents",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=100",
    "-m",
    "not app_build",
]
filterwarnings = ["error"]
markers = [
    "app_build: heavy macOS .app build smoke (opt-in via pytest -m app_build)",
]

[tool.coverage.run]
branch = false
source = ["core", "agents"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agents*"]

[tool.setuptools.package-data]
core = ["templates/*.html"]
